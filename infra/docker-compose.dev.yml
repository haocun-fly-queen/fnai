version: "3.9"

# Dev-only compose. Reuses the existing fnai-dev_default network (where
# fnai-postgres and fnai-redis already run). Only starts backend + frontend.

networks:
  fnai-dev_default:
    external: true

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fnai-backend-dev
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://fnai:fnai@fnai-postgres:5432/fnai_dev
      DATABASE_URL_SYNC: postgresql://fnai:fnai@fnai-postgres:5432/fnai_dev
      REDIS_URL: redis://fnai-redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      JWT_SECRET: dev-only-not-for-production-please-change-me
      OPENAI_API_KEY: ""
      SENTRY_DSN: ""
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app:ro
      # 把容器里 /tmp/fnai-storage/ 挂到 E 盘的 .workbuddy/storage/
      # 原因：上传的文件原本落在 Docker 的 WSL 虚拟磁盘 (C 盘)，
      #       容易占满 C 盘且拿不出来。挂到 E 盘既安全又可访问。
      - /e/workingbuddy/2026-06-18-10-20-53/.workbuddy/storage:/tmp/fnai-storage
    networks:
      - fnai-dev_default
    command: >
      sh -c "
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api/v1
    container_name: fnai-frontend-dev
    restart: unless-stopped
    environment:
      VITE_API_BASE: /api/v1
    ports:
      - "3000:80"
    networks:
      - fnai-dev_default
    depends_on:
      - backend
