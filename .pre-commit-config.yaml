# Pre-commit hooks
# 安装：pip install pre-commit && pre-commit install
# 跑全部：pre-commit run --all-files

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # ====== 后端 Python ======
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        name: Ruff lint (backend)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: Ruff format (backend)
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        name: mypy (backend)
        files: ^backend/app/
        additional_dependencies: [pydantic>=2.8]
        args: [--config=backend/pyproject.toml]

  # ====== 前端 TypeScript ======
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        name: Prettier (frontend)
        files: ^frontend/src/.*\.(ts|tsx|css|json)$
        additional_dependencies:
          - prettier@3.3.3
          - prettier-plugin-tailwindcss@0.6.6

  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        entry: bash -c 'cd frontend && [ -d node_modules ] && npx eslint --fix "$@" || echo "node_modules not installed, skipping" --'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: true

  # ====== 通用 ======
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^.*\.md$
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^infra/docker-compose\.yml$
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        name: Don't commit to main
        branches: [main]
      - id: detect-private-key
        name: Detect leaked private keys

  # ====== 提交信息规范 ======
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        name: Conventional commit message
        args: []
