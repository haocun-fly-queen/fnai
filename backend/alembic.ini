# Alembic configuration for FNAI Backend
# Docs: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# migration scripts directory
script_location = alembic

# template used to generate migration file names
# %(rev)s = revision id, %%(slug)s = slug from message
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# prepend sys.path with script_location
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pot files to be generated
# from the revision file
# file_prevent_transaction = false

# sqlalchemy.url is set programmatically in env.py from app settings
# Do NOT set it here (secrets would leak into version control)

[post_write_hooks]
# Format generated migration files with ruff
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
