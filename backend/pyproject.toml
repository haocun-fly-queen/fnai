[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.1.0"
description = "FNAI / GEO content production platform backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "FNAI Team" }]

# ⚠️ 注意：dependencies 这里只是占位参考
# CI 和 Docker 实际用的是 requirements.txt（同步关系要保持）
# 改一边要记得改另一边
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.10.0",
    "openai>=1.40.0",
    "pgvector>=0.3.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "markdown>=3.6",
    "python-multipart>=0.0.9",
    "tenacity>=9.0.0",
    "python-slugify>=8.0.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
# ⚠️ 这个 dev 段也跟 requirements-dev.txt 同步
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.8.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "freezegun>=1.5.0",
    "types-python-jose>=3.3.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # 行长（formatter 会处理）
    "B008",  # 在 FastAPI Depends() 中常用
    "RUF012", # 可变类属性
    "RUF001",  # ambiguous-unicode-character-string（中文标点）
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
    "RUF022",  # unsorted-dunder-all（我们 __all__ 顺序是按业务组织）
    "UP017",   # datetime-timezone-utc（datetime.UTC 在 3.11+ 才可用，我们要兼容）
    "UP035",   # deprecated-import（typing.X 还能用，先不强制）
    "UP042",   # replace-str-enum（str + Enum 在 FastAPI/Pydantic 里更顺手）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]  # 测试中允许 assert、允许用 True/False
"alembic/*" = ["E", "F", "I", "N"]  # 迁移文件宽松
"app/core/config.py" = ["F401"]  # pydantic-settings 重导出
"app/db/session.py" = ["F401"]  # 跨模块导出
"app/main.py" = ["F401"]  # 应用入口导出

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
# ⚠️ 暂时不开 strict：我们还有不带类型注解的代码
# 等所有 service / endpoint 都加完注解再打开
strict = false
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = false  # 暂时不强制

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# ⚠️ 暂时不加 --cov-fail-under=60，等有测试再加
# 现在还没写任何测试，强制覆盖率会 fail
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ============================================
# Hatch build configuration (FIX for CI)
# ============================================
[tool.hatch.build.targets.wheel]
packages = ["app"]
