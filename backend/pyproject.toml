[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fnai-backend"
version = "0.1.0"
description = "FNAI / GEO content production platform backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "FNAI Team" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",  # 同步驱动，给 alembic 用
    # Validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Cache / Queue
    "redis>=5.0.0",
    "celery>=5.4.0",
    # HTTP client
    "httpx>=0.27.0",
    # Logging / Monitoring
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.10.0",
    # AI / Vector
    "openai>=1.40.0",
    "pgvector>=0.3.0",
    # File parsing
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "markdown>=3.6",
    # Utilities
    "python-multipart>=0.0.9",
    "tenacity>=9.0.0",
    "python-slugify>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",  # TestClient
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.8.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "freezegun>=1.5.0",
    "types-python-jose>=3.3.4",
    "types-passlib>=1.7.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # 行长（formatter 会处理）
    "B008",  # 在 FastAPI Depends() 中常用
    "RUF012", # 可变类属性
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]  # 测试中允许 assert、允许用 True/False
"alembic/*" = ["E", "F", "I", "N"]  # 迁移文件宽松

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=60",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ============================================
# Hatch build configuration (FIX for CI)
# ============================================
[tool.hatch.build.targets.wheel]
packages = ["app"]
